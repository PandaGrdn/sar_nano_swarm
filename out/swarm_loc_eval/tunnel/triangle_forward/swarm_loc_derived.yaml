# DERIVED estimator config — generated by swarm_loc_scenarios.py for
# scenario tunnel/triangle_forward (launch.positions_xyz_m = actual spawn/reset
# geometry). Base: configs/estimation/swarm_loc.yaml. Do not edit; regenerate instead.
estimator:
  rate_hz: 50
  state_init_sigma_p_m: 0.05
  state_init_sigma_v_mps: 0.05
  state_init_sigma_psi_deg: 5.0
  yaw_bias_walk_sigma: 0.0001
  scale_init: 1.0
  scale_init_sigma: 0.02
  cov_floor_p_m: 0.01
  max_cov_p_m: 2.0
  gauge_age_q_m2_per_s: 0.05
  yaw_mode_window_s: 10.0
  yaw_mode_min_attempts: 20
  yaw_mode_accept_frac: 0.2
  yaw_mode_sigma_deg: 10.0
  yaw_mode_reset_sigma_deg: 60.0
  yaw_mode_cooldown_s: 30.0
launch:
  spawn_x0_m: 0.0
  spawn_y_m: 0.0
  spawn_z_m: 0.5
  spacing_m: 0.9
  init_yaw_deg: 0.0
  positions_xyz_m:
  - - 0.0
    - 0.45
    - 0.5
  - - 0.7794228634059948
    - 0.0
    - 0.5
  - - 0.0
    - -0.45
    - 0.5
entrance:
  position_xyz_m:
  - -2.0
  - 0.0
  - 0.3
  sigma_m: 0.01
  yaw_deg: 0.0
  device_id: 1000
measurements:
  use_bearing: true
  use_reciprocal_bearing: true
  use_range_only_fallback: true
  use_range_rate: true
  use_mutual_yaw: true
  range_rate_window: 5
  nis_gate_chi2_p: 0.99
  mutual_yaw_max_dt_s: 0.2
  max_measurement_age_s: 0.5
comms:
  broadcast_rate_hz: 10
  latency_ms: 20
  packet_loss: 0.02
  max_neighbors: 6
fusion:
  method: covariance_intersection
  ci_omega_search: fast
rio:
  source: real
  vel_bias_walk: 0.001
  yaw_walk_deg_per_min: 3.0
  scale_error: 1.02
  sigma_p: 0.02
  sigma_psi_deg: 0.5
  noise_ref_rate_hz: 50.0
  dropout_rate: 0.02
  dropout_duration_s: 0.5
  dropout_q_scale: 25.0
ablation:
  disable_uwb: false
  disable_bearing: false
  disable_entrance: false
  disable_rio: false
  uwb_noise_scale: 1.0
seed: 0
mlflow_experiment: phase2_swarm_loc
