# -- noise calibration (auto-generated -- re-run fit_uwb_noise.py) --
noise_calibration:
  source: "ETH-PBL UWB_DualAntenna_AoA (Margiani et al. 2023), fitted 2026-09-01"
  conditions: "STATIC / LOS / tripod-mounted lab rotation sweep; not flight/NLOS"
  dataset_channel_hz: 6489600000.0
  dataset_antenna_spacing_m: 0.0231
  dataset_pdoa_sign: -1.0
  range_method: cached_uwb_pdoa.yaml_eth_pbl_static
  range_bias_m: 0.0053
  range_sigma_m: 0.0873  # ETH-PBL static TWR residuals; not used as sim LOS if UTIL present
  range_by_distance_m:
  angle_bias_deg: 0.000
  angle_sigma_deg:
    model: piecewise_linear
    params:
      a_deg: 4.795      # sigma at boresight
      b_deg_per_deg: 0.1649  # sigma grows with |off-boresight angle|
  aoa_fov_deg: 90.0
  util:
    source: "UTIAS UTIL (Zhao et al. 2024 IJRR), DWM1000 TDOA, identification+flight"
    tdoa_note: "UTIL measures TDOA d12=d2-d1, not TWR. range_sigma_m = sigma_tdoa/sqrt(2). LOS sigma from robust flight TDOA (0.1537 m)."
    range_sigma_m: 0.1087
    range_bias_m: -0.0008
    ident_los_tdoa_sigma_m: 0.0757
    flight_los_tdoa_sigma_m: 0.1537
    flight_inflation_vs_ident: 2.032
    flight_inflation_vs_eth_static: 1.245
    nlos_bias_mean_m: 0.0870
    nlos_bias_sigma_m: 0.1273
    nlos_sigma_mult: 1.683
    range_nlos_outlier_rate: 0.0883

# Top-level sim knobs (consumed by uwb_model.py):
sigma_range_los_m: 0.1087
range_bias_m: -0.0008
angle_error_model: piecewise_linear
sigma_boresight_deg: 4.795
angle_sigma_slope_deg_per_deg: 0.1649
aoa_fov_deg: 90.0
nlos_bias_mean_m: 0.0870
nlos_bias_sigma_m: 0.1273
nlos_sigma_mult: 1.683
p_dropout_nlos: 0.0883

noise:
  range_sigma_m: 0.1087
  range_nlos_bias_m: 0.0870
  range_nlos_outlier_rate: 0.0883
  angle_sigma_deg:
    model: piecewise_linear
    params:
      a_deg: 4.795
      b_deg_per_deg: 0.1649
  aoa_fov_deg: 90.0
source:
  range: "UTIAS UTIL (Zhao et al. 2024 IJRR), DWM1000 TDOA, identification+flight"
  angle: "ETH-PBL UWB_DualAntenna_AoA, static/LOS ONLY — not flight-validated"
