    scan actually supports.
  imu_measurement_noise_std: 0.4877
  note_imu_measurement_noise_std: Set from the empirical std of (fitted velocity -
    ground truth velocity), NOT from residual_rms -- residual_rms only reflects internal
    fit consistency and misses systematic bias/scale error. Note measured bias was
    (0.9229, -1.0579) m/s; if that's non-trivial relative to sigma_vel, look at doppler_sign,
    radar extrinsic calibration, or IMU orientation before trusting this noise number
    in production.
